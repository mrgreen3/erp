# Grow the root partition to consume (almost) all remaining free space on
# the disk. Read by systemd-repart in the initrd (see mkinitcpio/repart
# hook). Idempotent by design: systemd-repart only grows, never shrinks,
# and is a no-op once the partition already matches this definition.
#
# PaddingMinBytes reserves a permanent 8M tail that root never claims.
# Without it, root grows to fill the disk to the exact last usable sector,
# leaving zero slack for GPT alignment/backup-header overhead — and
# systemd-repart then fails with "Can't fit requested partitions into
# available free space" on every subsequent boot (confirmed: this bites
# not just a never-resized image, but ALSO the very next boot after a
# successful grow, since growing also fills the disk exactly). The 8M
# margin is deliberately generous headroom, not a tightly-computed minimum.
[Partition]
Type=root
GrowFileSystem=yes
PaddingMinBytes=8M
