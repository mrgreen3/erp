# Grow the root partition to consume all remaining free space on the disk.
# Read by systemd-repart in the initrd (see mkinitcpio/repart hook).
# Idempotent by design: systemd-repart only grows, never shrinks, and is a
# no-op once the partition already matches this definition.
#
# Known limitation (see docs/status.md): systemd-repart fails with "Can't
# fit requested partitions into available free space" if this rule is
# declared while the disk is an *exact* byte-for-byte match for the
# already-built image (zero slack for GPT alignment overhead). Confirmed
# this is unrelated to Weight/PaddingWeight/PaddingMinBytes/SizeMinBytes
# tuning — any [Partition] Type=root rule fails identically on a zero-slack
# disk, while removing the rule entirely succeeds ("No changes"). Not
# expected to matter in practice: a real USB stick is never bit-identical
# in size to the source image, so real free space is always present.
[Partition]
Type=root
GrowFileSystem=yes
